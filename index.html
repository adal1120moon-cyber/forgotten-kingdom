<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잊힌 왕국</title><style> *{box-sizing:border-box}body{background:#141617;color:#e8dfcb;font:16px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:24px}h1,h2{color:#d5b579}small{color:#aaa}button,input,textarea{font:inherit;background:#24282b;color:#eee;border:1px solid #65583e;border-radius:6px;padding:10px;margin:4px;max-width:100%}button{cursor:pointer;color:#e9c98d}section,article{border:1px solid #494335;background:#1c1f21;padding:16px;border-radius:10px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}textarea{width:98%;min-height:80px}label{display:block}input[type=number]{width:90px} .map{display:flex;flex-wrap:wrap;gap:10px}.node{padding:18px;border:1px solid #766342;border-radius:8px} select{font:inherit;background:#24282b;color:#eee;padding:12px;max-width:100%}button{min-height:44px} @media(max-width:600px){main{padding:12px}section,article{padding:12px}} #log{max-height:220px;overflow:auto}</style><main><small>CHRONICLES / ONLINE TABLETOP</small><h1>잊힌 왕국 <small>V2</small></h1><section><button onclick="create()">GM · 새 방 만들기</button><input id="code" placeholder="방 코드"><button onclick="join()">플레이어 입장</button><p id="status">미리보기 · 방을 만들면 공유가 시작됩니다.</p></section><section id="player"></section><section id="chat"></section><nav id="nav"></nav><div id="view"></div></main><script>
const initial={characters:[{name:'어예준',level:19,stats:[17,10,10,20,0],titles:'고블린 슬레이어, 늑대 사냥꾼, 명사수',gear:'',place:'시작 마을'},{name:'한다윗',level:18,stats:[20,13,13,0,8],titles:'고블린 슬레이어, 늑대 사냥꾼',gear:'',place:'시작 마을'}],items:[['다크 울프의 송곳니 단검','+1'],['엘프가 쓰던 연습용 활','쿨다운 20%, +3'],['기사 지망생의 낡은 롱소드','+6'],['드워프가 졸면서 만든 석궁','쿨다운 21%, +4'],['마법 아카데미 학생이 쓰다 망가진 지팡이','마나 150 이상, 쿨다운 15% 증가, +15'],['패잔병의 피가 묻은 불에 탄 방패','체력 5% 증가, 방어력 7% 증가']],maps:[['시작 마을','임시 시작 장소']],rules:[['고블린 슬레이어','고블린 상대 +2 추가 데미지, 살기'],['늑대 사냥꾼','민첩성 +2, 체력 3% 증가'],['명사수 2Lv (10Lv 패시브)','모든 무기 명중률 5% 증가']],quests:[]};let state=structuredClone(initial),room='',key='',rev=0,tab='characters',busy=false;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names={characters:'캐릭터',items:'아이템',maps:'세계 지도',rules:'칭호 / 규칙',quests:'퀘스트'};function render(){ $('nav').innerHTML=Object.entries(names).map(([k,v])=>`<button onclick="tab='${k}';render()">${v}</button>`).join('');let edit=!room||key;let h=`<h2>${names[tab]}</h2>`;if(tab==='characters'){h+='<div class="grid">'+state.characters.map((c,i)=>`<article><h2>${esc(c.name)} · Lv.${esc(c.level)}</h2>${['힘','지구력','민첩성','마나','지능'].map((n,j)=>`<p>${n}: ${esc(c.stats[j])}</p>`).join('')}<p>칭호: ${esc(c.titles)}</p><p>장비: ${esc(c.gear)||'미설정'}</p><p>위치: ${esc(c.place)}</p>${edit?`<button onclick="editChar(${i})">수정</button><button onclick="remove(${i})">삭제</button>`:''}</article>`).join('')+'</div>'}else{h+=state[tab].map((a,i)=>`<article><b>${esc(a[0])}</b><p>${esc(a[1])}</p>${edit?`<button onclick="editEntry(${i})">수정</button><button onclick="remove(${i})">삭제</button>`:''}</article>`).join('')}if(edit)h+=`<button onclick="tab==='characters'?editChar(-1):editEntry(-1)">+ 추가</button>`;$('view').innerHTML=h}function editChar(i){let c=state.characters[i]||{name:'',level:1,stats:[0,0,0,0,0],titles:'',gear:'',place:''};$('view').innerHTML=`<section><label>이름<input id="n" value="${esc(c.name)}"></label><label>레벨<input id="lv" type="number" value="${c.level}"></label>${['힘','지구력','민첩성','마나','지능'].map((n,j)=>`<label>${n}<input id="s${j}" type="number" value="${c.stats[j]}"></label>`).join('')}<label>칭호<input id="t" value="${esc(c.titles)}"></label><label>장비<input id="g" value="${esc(c.gear)}"></label><label>위치<input id="p" value="${esc(c.place)}"></label><button onclick="saveChar(${i})">저장</button><button onclick="render()">취소</button></section>`}function saveChar(i){let c={name:$('n').value,level:+$('lv').value,stats:Array.from({length:5},(_,j)=>+$('s'+j).value),titles:$('t').value,gear:$('g').value,place:$('p').value};if(!c.name)return; if(i<0)state.characters.push(c);else state.characters[i]=c;save()}function editEntry(i){let a=state[tab][i]||['',''];$('view').innerHTML=`<section><input id="n" placeholder="이름" value="${esc(a[0])}"><textarea id="d" placeholder="설명 / 효과">${esc(a[1])}</textarea><button onclick="saveEntry(${i})">저장</button><button onclick="render()">취소</button></section>`}function saveEntry(i){let a=[$('n').value,$('d').value];if(!a[0])return;if(i<0)state[tab].push(a);else state[tab][i]=a;save()}function remove(i){if(room&&tab==='characters'){alert('온라인 방에서는 캐릭터 삭제 대신 수정하세요.');return}if(confirm('삭제할까요?')){state[tab].splice(i,1);save()}}async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error('서버 연결 또는 저장 실패');return r.json()}async function create(){try{let r=await post('/api/create',{state});room=r.code;key=r.key;rev=0;localStorage.setItem('gm:'+room,key);$('code').value=room;$('status').textContent='GM 방 코드: '+room+' · 친구에게 코드를 공유하세요.';render()}catch(e){alert('서버를 먼저 실행해야 합니다.')}}async function join(){try{let c=$('code').value.trim();let r=await fetch('/api/room/'+encodeURIComponent(c));if(!r.ok)throw Error();let d=await r.json();room=c;key=localStorage.getItem('gm:'+room)||'';state=d.state;rev=d.rev;$('status').textContent=(key?'GM':'플레이어')+' / 방 '+room;render();panel(d)}catch(e){alert('방을 찾을 수 없습니다.')}}async function save(){if(room&&key){busy=true;try{let d=await post('/api/save',{code:room,key,state,rev});rev=d.rev}catch(e){alert(e.message);await join()}finally{busy=false}}render()}setInterval(async()=>{if(!room||busy)return;try{let r=await fetch('/api/room/'+room);let d=await r.json();if(d.rev!==rev && !$('n')){state=d.state;rev=d.rev;render()} panel(d)}catch(e){}},1500);render();
function identity(){let x=JSON.parse(localStorage.getItem('player:'+room)||'null');return {code:room,key,i:x?.i??-1,token:x?.token??''}}
async function claim(i){try{let d=await post('/api/claim',{code:room,i});localStorage.setItem('player:'+room,JSON.stringify({i,token:d.token}));await join()}catch(e){alert('이미 선택된 캐릭터이거나 접속 오류입니다.')}}
async function act(path,extra={}){try{await post('/api/'+path,{...identity(),...extra});let d=await (await fetch('/api/room/'+room)).json();if(!$('n')){state=d.state;rev=d.rev;render()}panel(d)}catch(e){alert(e.message)}}
function panel(d){if(!room)return;let x=identity(),c=state.characters[x.i];let el=$('player');if(key)el.innerHTML='<b>게임 마스터</b>';else if(!c)el.innerHTML='<b>캐릭터 선택</b>'+state.characters.map((c,i)=>`<button onclick="claim(${i})">${esc(c.name)}</button>`).join('');else el.innerHTML=`<b>내 캐릭터 · ${esc(c.name)}</b><p>현재 장비: ${esc(c.gear)} / 위치: ${esc(c.place)}</p>`+[['gear','items','장비 장착'],['place','maps','지도 이동']].map(([f,t,n])=>`<label>${n}<select onchange="act('action',{field:'${f}',value:this.value})"><option value="">선택</option>${state[t].map(a=>`<option>${esc(a[0])}</option>`).join('')}</select></label>`).join('');let chat=$('chat');if(!chat.querySelector('#msg'))chat.innerHTML='<b>모험 기록 / 채팅</b><div id="log"></div><input id="msg" maxlength="500" placeholder="메시지"><button onclick="sendChat()">전송</button><button onclick="act(&quot;roll&quot;)">D20 굴리기</button>'; $('log').innerHTML=(d.chat||[]).slice(-15).map(a=>`<p><b>${esc(a[0])}</b> ${esc(a[1])}</p>`).join('')}
function sendChat(){let m=$('msg');if(m.value.trim()){act('chat',{message:m.value});m.value=''}}
</script></html>
